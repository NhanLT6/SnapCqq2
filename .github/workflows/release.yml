name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test SnapCqq2.Tests/SnapCqq2.Tests.csproj -c Release

      - name: Publish
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet publish SnapCqq2/SnapCqq2.csproj -p:PublishProfile=FolderProfile -p:Version=$version -o out/sc
          dotnet publish SnapCqq2/SnapCqq2.csproj -p:PublishProfile=FrameworkDependent -p:Version=$version -o out/fd
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/sc/SnapCqq2.exe "dist/SnapCqq2-$env:TAG-win-x64.exe"
          Copy-Item out/fd/SnapCqq2.exe "dist/SnapCqq2-$env:TAG-win-x64-net8-runtime.exe"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: dist/*.exe
          body: |
            - `SnapCqq2-${{ env.TAG }}-win-x64.exe`: self-contained, runs without installing .NET.
            - `SnapCqq2-${{ env.TAG }}-win-x64-net8-runtime.exe`: smaller, requires [.NET 8 Desktop Runtime (x64)](https://dotnet.microsoft.com/download/dotnet/8.0).
